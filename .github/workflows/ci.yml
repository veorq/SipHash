name: Linux CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      CFLAGS: -std=c99 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build all variants
        run: make CC="$CC" CFLAGS="$CFLAGS" all
      - name: Check test vectors
        run: |
          ./test
          ./debug > "$RUNNER_TEMP/siphash-debug.log"
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make CC="$CC" CFLAGS="$CFLAGS" sanitize
